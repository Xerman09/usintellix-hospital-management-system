<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/src/styles/main.css">
<style>#log { white-space: pre-wrap; font-family: monospace; background: #eee; padding: 10px; margin-top: 20px; font-size: 12px; }</style>
</head>
<body>
<div id="root"></div>
<div id="log"></div>
<script type="module">
const log = (m) => { document.getElementById('log').textContent += m + "\n"; };
try { localStorage.setItem('token', 'test-token'); } catch (e) {}
try { sessionStorage.setItem('user', JSON.stringify({ id: 1, role: 'admin' })); } catch (e) {}

window.__lastOpenedPatient = null;
window.__lastOpenedNewTabUrl = null;
window.tabManager = {
    openTab: (id, title, renderFn) => {
        window.__lastPatientsTabHtml = renderFn();
    }
};

const originalFetch = window.fetch;
window.fetch = async (url) => {
    const u = String(url);
    if (u.includes('/patients') && !u.includes('/patient-')) {
        return new Response(JSON.stringify({ success: true, data: [
            { id: 1, patient_no: 'PAT-000001', first_name: 'Phil', last_name: 'Belford', contact_home_phone: '555-1000', birthdate: '1972-02-09' },
            { id: 2, patient_no: 'PAT-000002', first_name: 'Test', last_name: 'Patient', contact_home_phone: '', birthdate: '2000-01-01' },
            { id: 3, patient_no: 'PAT-000003', first_name: 'Ann', last_name: 'Cardio', contact_home_phone: '555-2000', birthdate: '1990-05-05' }
        ] }), { status: 200 });
    }
    return originalFetch(url);
};

const { openPatientChartTab } = await import('/src/modules/patients/patients-list.js');
window.__realOpenPatientChartTab = openPatientChartTab;

const { PatientFinderView } = await import('/src/modules/patients/patient-finder.view.js');
const { initPatientFinder } = await import('/src/modules/patients/patient-finder.js');

document.getElementById('root').innerHTML = PatientFinderView();
await initPatientFinder();

log("initial pagination text: " + document.getElementById('fndPaginationInfo').textContent);
log("initial row count: " + document.querySelectorAll('.fnd-row').length);

// name filter
document.getElementById('fndFilterName').value = 'Phil';
document.getElementById('fndFilterName').dispatchEvent(new Event('input'));
log("after name filter 'Phil' -> rows: " + document.querySelectorAll('.fnd-row').length);
log("pagination w/ filter: " + document.getElementById('fndPaginationInfo').textContent);
document.getElementById('fndFilterName').value = '';
document.getElementById('fndFilterName').dispatchEvent(new Event('input'));

// global search matches patient_no even though not a column
document.getElementById('fndGlobalSearch').value = 'PAT-000002';
document.getElementById('fndGlobalSearch').dispatchEvent(new Event('input'));
log("global search by patient_no -> rows: " + document.querySelectorAll('.fnd-row').length + " first name: " + (document.querySelector('.fnd-name')?.textContent || 'NONE'));
document.getElementById('fndGlobalSearch').value = '';
document.getElementById('fndGlobalSearch').dispatchEvent(new Event('input'));

// exact method
document.getElementById('fndFilterName').value = 'Phi';
document.getElementById('fndExactMethod').checked = true;
document.getElementById('fndFilterName').dispatchEvent(new Event('input'));
log("exact method 'Phi' (should be 0, not substring match): " + document.querySelectorAll('.fnd-row').length);
document.getElementById('fndExactMethod').checked = false;
document.getElementById('fndFilterName').value = '';
document.getElementById('fndFilterName').dispatchEvent(new Event('input'));

// sort
document.querySelector('.fnd-header-row th[data-sort-key="name"]').click();
const namesAsc = [...document.querySelectorAll('.fnd-name')].map(td => td.textContent.trim());
document.querySelector('.fnd-header-row th[data-sort-key="name"]').click();
const namesDesc = [...document.querySelectorAll('.fnd-name')].map(td => td.textContent.trim());
log("sort asc: " + JSON.stringify(namesAsc));
log("sort desc: " + JSON.stringify(namesDesc));
log("sort arrow present: " + document.querySelector('.fnd-sort-arrow')?.textContent);

// pagination with pageSize=1
document.getElementById('fndPageSize').value = '1';
document.getElementById('fndPageSize').dispatchEvent(new Event('change'));
log("pageSize=1 -> rows: " + document.querySelectorAll('.fnd-row').length + " prev disabled: " + document.getElementById('fndPrevBtn').disabled + " next disabled: " + document.getElementById('fndNextBtn').disabled);
document.getElementById('fndNextBtn').click();
log("after next -> pagination: " + document.getElementById('fndPaginationInfo').textContent + " prev disabled: " + document.getElementById('fndPrevBtn').disabled);
document.getElementById('fndPageSize').value = '10';
document.getElementById('fndPageSize').dispatchEvent(new Event('change'));

// SSN/External always blank + never match
document.getElementById('fndFilterSsn').value = '123-45-6789';
document.getElementById('fndFilterSsn').dispatchEvent(new Event('input'));
log("SSN filter (should be 0, no data exists): " + document.querySelectorAll('.fnd-row').length);
document.getElementById('fndFilterSsn').value = '';
document.getElementById('fndFilterSsn').dispatchEvent(new Event('input'));

// row click -> open chart (current tab)
document.querySelector('.fnd-row').click();
await new Promise(r => setTimeout(r, 50));
log("after row click, lastActivePatientChartNo: " + localStorage.getItem('lastActivePatientChartNo'));

// open in new tab checkbox
let capturedOpenUrl = null;
const origOpen = window.open;
window.open = (url) => { capturedOpenUrl = url; return {}; };
document.getElementById('fndOpenNewTab').checked = true;
document.querySelectorAll('.fnd-row')[1].click();
window.open = origOpen;
log("open-in-new-tab: window.open called: " + (capturedOpenUrl !== null));
log("open-in-new-tab: pendingPatientView set: " + localStorage.getItem('pendingPatientView'));
document.getElementById('fndOpenNewTab').checked = false;

// recent patients tab
document.getElementById('fndTabRecent').click();
await new Promise(r => setTimeout(r, 50));
log("recent panel visible: " + (document.getElementById('fndRecentPanel').style.display !== 'none'));
log("recent rows: " + document.querySelectorAll('#fndRecentBody .fnd-row').length);
log("recent first name: " + (document.querySelector('#fndRecentBody .fnd-name')?.textContent || 'NONE'));

// Add Patient cross-tab trigger check (admin role, just-widened gate)
document.getElementById('fndTabList').click();
document.getElementById('fndAddPatientBtn').click();
await new Promise(r => setTimeout(r, 50));
log("PatientsListView (admin) contains Add button: " + (window.__lastPatientsTabHtml || '').includes('id="openAddPatientModal"'));
</script>
</body>
</html>
